<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Pharmacy OS</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .box { text-align: center; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid rgba(148, 163, 184, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
    .sub { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="title">AI Pharmacy OS</div>
    <div class="sub">Starting local server…</div>
  </div>
</body>
</html>
