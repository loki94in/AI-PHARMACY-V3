name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version number'
        required: false
        default: '1.0.0'

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'pharmacy-mobile/package-lock.json'

      - name: Install Mobile Dependencies
        working-directory: ./pharmacy-mobile
        run: npm ci

      - name: Expo Prebuild (Generate iOS Native Project)
        working-directory: ./pharmacy-mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ./pharmacy-mobile/ios
        run: pod install

      - name: Build Xcode Archive (Unsigned)
        working-directory: ./pharmacy-mobile/ios
        run: |
          xcodebuild archive \
            -workspace PharmacyGenius.xcworkspace \
            -scheme PharmacyGenius \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "../build/PharmacyGenius.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for Sideloadly
        working-directory: ./pharmacy-mobile
        run: |
          mkdir -p Payload
          cp -R build/PharmacyGenius.xcarchive/Products/Applications/*.app Payload/
          zip -qr PharmacyGenius-Sideloadly.ipa Payload

      - name: Upload Sideloadly IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyGenius-Sideloadly-${{ github.sha }}
          path: pharmacy-mobile/PharmacyGenius-Sideloadly.ipa
          retention-days: 14
